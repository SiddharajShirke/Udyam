openapi: 3.0.3
info:
  title: InnovateProcure API
  version: 0.1.0
  description: >
    Source-of-truth contract for apps/api. Every endpoint the platform needs
    is listed here as a stub. Update this file BEFORE implementing a shape
    change — see the verify-api-contract skill.
servers:
  - url: http://localhost:4000
    description: Local dev

tags:
  - name: auth
  - name: registrations
  - name: problems
  - name: sandboxes
  - name: evaluations
  - name: contracts
  - name: startups
  - name: ministries
  - name: audit
  - name: ai

paths:
  /health:
    get:
      tags: [auth]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }

  /auth/me:
    get:
      tags: [auth]
      summary: Get current session user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /registrations:
    post:
      tags: [registrations]
      summary: Submit a registration request (ministry or startup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequest"
    get:
      tags: [registrations]
      summary: List registration requests (admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of registration requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationRequest"

  /registrations/{id}/review:
    post:
      tags: [registrations]
      summary: Approve or reject a registration request (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/RegistrationStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequest"

  /problems:
    get:
      tags: [problems]
      summary: List problem statements
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of problems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Problem"
    post:
      tags: [problems]
      summary: Create a problem statement (ministry)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /problems/{id}:
    get:
      tags: [problems]
      summary: Get a problem statement
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /problems/{id}/format:
    post:
      tags: [problems]
      summary: Run the AI problem-formatter agent on a raw problem
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Formatted problem statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /sandboxes:
    post:
      tags: [sandboxes]
      summary: Open a sandbox for a problem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
    get:
      tags: [sandboxes]
      summary: List sandboxes
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sandbox"

  /sandboxes/{id}:
    get:
      tags: [sandboxes]
      summary: Get a sandbox
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"

  /sandboxes/{id}/results:
    post:
      tags: [sandboxes]
      summary: Submit a sandbox result (startup)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxResultInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxResult"
    get:
      tags: [sandboxes]
      summary: List results for a sandbox
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: List of sandbox results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxResult"

  /evaluations/{sandboxId}:
    get:
      tags: [evaluations]
      summary: Get the AI evaluation report + evaluator verdict for a sandbox
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sandboxId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
    post:
      tags: [evaluations]
      summary: Record an evaluator's verdict for a sandbox
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sandboxId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evaluator_verdict: { type: string }
      responses:
        "200":
          description: Updated evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"

  /contracts:
    post:
      tags: [contracts]
      summary: Draft a contract for a sandbox winner
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /contracts/{id}:
    get:
      tags: [contracts]
      summary: Get a contract
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /startups:
    get:
      tags: [startups]
      summary: List startups
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of startups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Startup"

  /startups/{id}:
    get:
      tags: [startups]
      summary: Get a startup profile
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Startup"

  /ministries:
    get:
      tags: [ministries]
      summary: List ministries
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of ministries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ministry"

  /audit-logs:
    get:
      tags: [audit]
      summary: List audit log entries (admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ---- apps/ai-engine — internal-only, called by apps/api, not the browser.
  # Every route requires the shared X-Internal-Secret header (see
  # internalSecretAuth below and apps/ai-engine/lib/internal_auth.py).
  /ai/format-problem:
    post:
      tags: [ai]
      summary: Run the Problem Formatter agent on raw ministry input
      security: [{ internalSecretAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormatProblemInput"
      responses:
        "200":
          description: Structured problem statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormattedProblem"
        "401":
          description: Missing or invalid X-Internal-Secret header
        "422":
          description: Validation error (e.g. Claude response missing required keys)

  /ai/generate-kpis:
    post:
      tags: [ai]
      summary: Run the KPI Generator agent on a formatted problem statement
      security: [{ internalSecretAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateKpisInput"
      responses:
        "200":
          description: KPI list — weights sum to 1.0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kpi"
        "401":
          description: Missing or invalid X-Internal-Secret header
        "422":
          description: Validation error (e.g. weights don't sum to 1.0 after retry)

  /ai/evaluate:
    post:
      tags: [ai]
      summary: Run the Evaluation agent over one or more startups' sandbox scores
      security: [{ internalSecretAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateInput"
      responses:
        "200":
          description: Structured evaluation report (draft, for human Evaluator review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationReport"
        "401":
          description: Missing or invalid X-Internal-Secret header
        "422":
          description: Validation error (e.g. missing report section)

  /ai/draft-contract:
    post:
      tags: [ai]
      summary: Run the Contract Drafter agent for a sandbox's winning startup
      security: [{ internalSecretAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftContractInput"
      responses:
        "200":
          description: Draft contract text, IP clause, and milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDraft"
        "401":
          description: Missing or invalid X-Internal-Secret header
        "422":
          description: Validation error (e.g. incomplete evaluation input — never drafts a garbage contract)

  /ai/fanout:
    post:
      tags: [ai]
      summary: Autonomous best-match fan-out — sandbox-test the top eligible startups concurrently and rank them
      security: [{ internalSecretAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FanOutInput"
      responses:
        "200":
          description: Per-startup results plus a comparative ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanOutResult"
        "401":
          description: Missing or invalid X-Internal-Secret header
        "422":
          description: Validation error (e.g. empty startups list)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalSecretAuth:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: >
        Shared secret between apps/api and apps/ai-engine (INTERNAL_SECRET
        in both .env files). Not a user-facing credential — apps/api is the
        only intended caller of /ai/* routes.

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    RegistrationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    Role:
      type: string
      enum: [ADMIN, MINISTRY, EVALUATOR, STARTUP]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        ministry_id: { type: string, nullable: true }
        startup_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RegistrationRequestInput:
      type: object
      required: [applicant_type, applicant_data]
      properties:
        applicant_type: { type: string, example: startup }
        applicant_data: { type: object }

    RegistrationRequest:
      allOf:
        - $ref: "#/components/schemas/RegistrationRequestInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/RegistrationStatus" }
            reviewed_by: { type: string, nullable: true }
            reviewed_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }

    Ministry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        created_at: { type: string, format: date-time }

    Startup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        dpiit_number: { type: string, nullable: true }
        gst_number: { type: string, nullable: true }
        domain_tags: { type: array, items: { type: string } }
        trust_score: { type: integer }
        poc_url: { type: string, nullable: true }
        dpiit_cert_url: { type: string, nullable: true }
        stage: { type: string }
        verification_status: { $ref: "#/components/schemas/RegistrationStatus" }
        created_at: { type: string, format: date-time }

    ProblemInput:
      type: object
      required: [title, raw_input]
      properties:
        title: { type: string }
        raw_input: { type: string }
        domain_tags: { type: array, items: { type: string } }
        budget_max: { type: integer, nullable: true }
        timeline_days: { type: integer, nullable: true }

    Problem:
      allOf:
        - $ref: "#/components/schemas/ProblemInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ministry_id: { type: string, format: uuid }
            created_by: { type: string, format: uuid }
            formatted_ps: { type: object, nullable: true }
            status: { type: string, example: DRAFT }
            created_at: { type: string, format: date-time }

    SandboxInput:
      type: object
      required: [problem_id]
      properties:
        problem_id: { type: string, format: uuid }
        mode: { type: string, default: auto }
        kpis: { type: object, nullable: true }
        time_box_days: { type: integer, default: 30 }

    Sandbox:
      allOf:
        - $ref: "#/components/schemas/SandboxInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_by: { type: string, format: uuid }
            status: { type: string, example: OPEN }
            deadline: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }

    SandboxResultInput:
      type: object
      required: [startup_id]
      properties:
        startup_id: { type: string, format: uuid }

    SandboxResult:
      allOf:
        - $ref: "#/components/schemas/SandboxResultInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            sandbox_id: { type: string, format: uuid }
            token: { type: string, nullable: true }
            scores: { type: object, nullable: true }
            total_score: { type: number, nullable: true }
            status: { type: string, example: INVITED }
            deploy_count: { type: integer }

    Evaluation:
      type: object
      properties:
        id: { type: string, format: uuid }
        sandbox_id: { type: string, format: uuid }
        ai_report: { type: object, nullable: true }
        evaluator_id: { type: string, nullable: true }
        evaluator_verdict: { type: string, nullable: true }
        status: { type: string, example: PENDING }
        created_at: { type: string, format: date-time }

    ContractInput:
      type: object
      required: [sandbox_id, problem_id, winner_id, ministry_id]
      properties:
        sandbox_id: { type: string, format: uuid }
        problem_id: { type: string, format: uuid }
        winner_id: { type: string, format: uuid }
        ministry_id: { type: string, format: uuid }

    Contract:
      allOf:
        - $ref: "#/components/schemas/ContractInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            contract_text: { type: string, nullable: true }
            ip_clause: { type: string, nullable: true }
            milestones: { type: object, nullable: true }
            status: { type: string, example: DRAFT }
            created_at: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, nullable: true }
        action: { type: string }
        entity_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---- apps/ai-engine schemas ----

    FormatProblemInput:
      type: object
      required: [raw_input]
      properties:
        raw_input: { type: string }
        department_type: { type: string, default: general }

    FormattedProblem:
      type: object
      required: [title, outcome, domain_tags, suggested_kpis, scope]
      properties:
        title: { type: string }
        outcome: { type: string }
        domain_tags: { type: array, items: { type: string } }
        suggested_kpis: { type: array, items: { type: string } }
        scope: { type: string }

    GenerateKpisInput:
      type: object
      required: [formatted_ps]
      properties:
        formatted_ps: { $ref: "#/components/schemas/FormattedProblem" }
        domain: { type: string, default: general }

    Kpi:
      type: object
      required: [name, metric, threshold, weight]
      properties:
        name: { type: string }
        metric: { type: string }
        threshold: { type: string }
        weight:
          type: number
          description: Across all KPIs in one response, weights sum to 1.0

    EvaluateInput:
      type: object
      required: [sandbox_scores, kpis]
      properties:
        sandbox_scores:
          type: object
          description: "{ startup_id: { kpi_name: score, ... }, ... }"
        kpis:
          type: array
          items: { $ref: "#/components/schemas/Kpi" }

    EvaluationReport:
      type: object
      required:
        [
          executive_summary,
          per_kpi_breakdown,
          comparison_table,
          recommendation,
          caveats,
        ]
      properties:
        executive_summary: { type: string }
        per_kpi_breakdown: { type: array, items: { type: object } }
        comparison_table: { type: array, items: { type: object } }
        recommendation: { type: string }
        caveats: { type: array, items: { type: string } }

    DraftContractInput:
      type: object
      required: [evaluation, winner, problem]
      properties:
        evaluation: { $ref: "#/components/schemas/EvaluationReport" }
        winner: { type: object }
        problem: { type: object }

    ContractDraft:
      type: object
      required: [contract_text, ip_clause, milestones]
      properties:
        contract_text: { type: string }
        ip_clause: { type: string }
        milestones:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              kpi_threshold: { type: string }
              amount_lakhs: { type: number }

    FanOutInput:
      type: object
      required: [problem_id, formatted_ps, kpis, startups]
      properties:
        problem_id: { type: string, format: uuid }
        formatted_ps: { $ref: "#/components/schemas/FormattedProblem" }
        kpis:
          type: array
          items: { $ref: "#/components/schemas/Kpi" }
        startups:
          type: array
          description: Eligible pool — the fan-out caps at the top 6 by matchmaking score
          items:
            type: object
            required: [id, submission_type, submission_target]
            properties:
              id: { type: string, format: uuid }
              domain_tags: { type: array, items: { type: string } }
              submission_type: { type: string, enum: [e2b, external_url] }
              submission_target:
                type: string
                description: E2B code reference, or a live HTTPS URL, depending on submission_type

    FanOutResult:
      type: object
      required: [candidates_considered, results, ranked, best_startup_id, per_startup_feedback]
      properties:
        candidates_considered:
          type: integer
          description: Number actually sandbox-tested (capped at 6)
        results:
          type: object
          description: "{ startup_id: { status, scores, error }, ... } — identical shape regardless of submission_type"
        ranked:
          type: array
          items:
            type: object
            properties:
              startup_id: { type: string }
              total_score: { type: number }
              rank: { type: integer }
        best_startup_id: { type: string }
        per_startup_feedback:
          type: object
          description: "{ startup_id: \"comparative reason for this ranking\", ... }"
